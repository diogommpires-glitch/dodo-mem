name: Source verification

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.4'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked
      - run: uv run --locked ruff check dodo_memory tests
      - run: uv run --locked ruff format --check dodo_memory tests
      - name: Run synthetic unit tests with controlled hardware observations
        run: uv run --locked pytest tests -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Gitleaks and scan only the checked Git tree
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          mkdir "$RUNNER_TEMP/checked-tree"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/checked-tree"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/checked-tree" --redact --no-banner
