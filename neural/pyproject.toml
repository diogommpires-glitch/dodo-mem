[project]
name = "dodo-memory-neural"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
description = "Local neural organisation and evidence routing for Dodo Mem"
requires-python = ">=3.13,<3.14"
dependencies = [
  "dodo-memory", "dodo-memory-desktop",
  "openvino==2026.4.1", "usearch==2.26.6", "igraph==1.0.0",
  "tokenizers==0.23.3", "numpy==2.5.4", "httpx>=0.28,<1",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "psutil>=7,<8",
]

[project.scripts]
dodo-mem-neural = "dodo_mem_neural.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dodo_mem_neural"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "SIM", "UP", "FURB", "PERF", "C4", "RET"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
dodo-memory = { path = "..", editable = true }
dodo-memory-desktop = { path = "../desktop", editable = true }
