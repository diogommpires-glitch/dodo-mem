[project]
name = "dodo-memory"
version = "0.1.0"
description = "Dodo's Markdown memory and bounded agent handoffs"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "pypdf==6.21.4", "httpx==0.28.1", "uvicorn==0.54.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
dodo-memory = "dodo_memory.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dodo_memory*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["SIM", "UP", "FURB", "PERF", "C4", "RET"]

[tool.pytest.ini_options]
testpaths = ["tests"]
